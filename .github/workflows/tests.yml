name: tests

# ทุก push เข้า main + ทุก pull request (รวมกดรันเองได้จากแท็บ Actions)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # ต้องรันบน Windows: โค้ดผูกกับ DPAPI (เข้ารหัส key), Job Object (ฆ่าโปรเซสลูกตอน timeout)
    # และพาธแบบ Windows — ถ้าวันหนึ่งรองรับ Linux ได้ ค่อยเพิ่ม runner เข้า matrix
    runs-on: windows-latest
    strategy:
      fail-fast: false
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      SOONAI_TEST_JOBS: "4"        # เทสต์รันขนานเป็น subprocess (มีอยู่แล้วใน standalone_suite_test.py)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: ติดตั้ง dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install pip-audit

      - name: ตรวจ dependency vulnerabilities
        run: pip-audit -r requirements.txt

      - name: ตรวจ secrets ที่เผลอ commit
        shell: pwsh
        run: |
          $patterns = 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}'
          $hits = git grep -n -I -E $patterns -- . ':!shared/keys.example.json' ':!shared/mcp.example.json' 2>$null
          if ($LASTEXITCODE -eq 0 -and $hits) {
            Write-Error "Potential secret detected in tracked files:`n$hits"
            exit 1
          }

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: ด่านสถาปัตยกรรมโมดูล (ไม่มี import/bind cycle)
        run: python depgraph.py --check

      # ⚠️ ห้ามตั้ง SOONAI_UPDATE_GOLDEN บน CI — ถ้าตั้ง golden test จะเขียนไฟล์คาดหวังทับ
      # แทนที่จะเทียบ (test_golden.py) แล้ว CI จะไม่จับการเปลี่ยนพฤติกรรมอีกเลย
      - name: เทสต์ทั้งชุด
        run: python -m pytest

      - name: smoke test (CLI ตอบ --version ได้)
        run: python soonai.py --version
