name: tests

# ทุก push เข้า main + ทุก pull request (รวมกดรันเองได้จากแท็บ Actions)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # ต้องรันบน Windows: โค้ดผูกกับ DPAPI (เข้ารหัส key), Job Object (ฆ่าโปรเซสลูกตอน timeout)
    # และพาธแบบ Windows — ถ้าวันหนึ่งรองรับ Linux ได้ ค่อยเพิ่ม runner เข้า matrix
    runs-on: windows-latest
    strategy:
      fail-fast: false
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      SOONAI_TEST_JOBS: "4"        # เทสต์รันขนานเป็น subprocess (มีอยู่แล้วใน standalone_suite_test.py)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: ตรวจ Node dependencies
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: ตรวจ license service dependencies
        working-directory: license-service
        run: |
          npm ci
          npm audit --audit-level=moderate
          node --check src/index.js
          node --check tests/integration.mjs

      - name: ตรวจ SHA-256 ของ EXE
        shell: pwsh
        run: |
          $line = Get-Content exesoonai/SHA256SUMS.txt | Select-Object -First 1
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash exesoonai/soonai.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "EXE checksum mismatch: expected $expected, got $actual" }

      - name: smoke test (standalone EXE)
        run: .\exesoonai\soonai.exe --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: ติดตั้ง dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install pip-audit

      - name: ตรวจ dependency vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: ตรวจ secrets ที่เผลอ commit
        shell: pwsh
        run: |
          $patterns = '-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[A-Za-z0-9_-]{30,}|sk-[A-Za-z0-9]{32,}'
          $hits = git grep -n -I -i -E -e $patterns -- . ':!shared/keys.example.json' ':!shared/mcp.example.json' 2>$null
          $scanExit = $LASTEXITCODE
          if ($scanExit -eq 0 -and $hits) {
            Write-Error "Potential secret detected in tracked files:`n$hits"
            exit 1
          }
          if ($scanExit -gt 1) { throw "Secret scan failed with git grep exit code $scanExit" }

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: ด่านสถาปัตยกรรมโมดูล (ไม่มี import/bind cycle)
        run: python depgraph.py --check

      - name: เทสต์ทั้งชุด
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path . -File | Where-Object { $_.Name -like 'test_*.py' -or $_.Name -like '*_test.py' }
          if ($tests) {
            python -m pytest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No Python test files are tracked; running CLI smoke checks instead."
            python soonai.py --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node index.js --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: smoke test (CLI ตอบ --version ได้)
        run: python soonai.py --version
